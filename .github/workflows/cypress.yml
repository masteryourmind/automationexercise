name: Cypress Tests

on:
  push: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cypres run
        uses: cypress-io/github-action@v6
        with:
          build: npm ci
          start: npx cypress run

    